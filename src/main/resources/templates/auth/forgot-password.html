<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/public_layout}">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - EcoSwap</title>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body layout:fragment="content">
    <main>
        <div class="form-container">
            <h1><span style="color: #1dbf73;">Eco</span>Swap</h1>
            <h2 style="text-align: center; color: #333; font-size: 24px; margin-bottom: 10px;">Forgot Password</h2>
            <p style="text-align: center; color: #666; margin-bottom: 30px;">
                Enter your email address and we'll send you a link to reset your password.
            </p>

            <!-- Success Message -->
            <div th:if="${message}"
                 style="color: #155724;
                        background-color: #d4edda;
                        border: 1px solid #c3e6cb;
                        padding: 12px;
                        border-radius: 6px;
                        margin-bottom: 20px;
                        text-align: center;">
                <span th:text="${message}"></span>
            </div>

            <!-- Error Message -->
            <div th:if="${error}"
                 style="color: #dc3545;
                        background-color: #f8d7da;
                        border: 1px solid #f5c6cb;
                        padding: 12px;
                        border-radius: 6px;
                        margin-bottom: 20px;
                        text-align: center;">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/forgot-password}" method="post">
                <label for="email">Email Address</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email address"
                       required
                       autofocus/>

                <button type="submit">Send Reset Link</button>

                <p style="margin-top: 30px; text-align: center;">
                    Remember your password?
                    <a th:href="@{/login}"
                       style="color: #1dbf73;
                              text-decoration: none;
                              font-weight: 500;">
                        Back to Login
                    </a>
                </p>
            </form>
        </div>
    </main>

    <style>
        /* Additional hover effect for links */
        .form-container a:hover {
            text-decoration: underline !important;
        }
    </style>
</body>
</html>
