<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/public_layout}">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - EcoSwap</title>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body layout:fragment="content">
    <main>
        <div class="form-container">
            <h1><span style="color: #1dbf73;">Eco</span>Swap</h1>
            <h2 style="text-align: center; color: #333; font-size: 24px; margin-bottom: 10px;">Reset Password</h2>
            <p style="text-align: center; color: #666; margin-bottom: 10px;">
                Enter your new password below.
            </p>
            <p style="text-align: center; color: #999; font-size: 14px; margin-bottom: 30px;">
                Resetting password for: <strong th:text="${email}"></strong>
            </p>

            <!-- Error Message -->
            <div th:if="${error}"
                 style="color: #dc3545;
                        background-color: #f8d7da;
                        border: 1px solid #f5c6cb;
                        padding: 12px;
                        border-radius: 6px;
                        margin-bottom: 20px;
                        text-align: center;">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/reset-password}" method="post">
                <input type="hidden" name="token" th:value="${token}"/>

                <label for="password">New Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter new password"
                       minlength="6"
                       required
                       autofocus/>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password"
                       id="confirmPassword"
                       name="confirmPassword"
                       placeholder="Confirm new password"
                       minlength="6"
                       required/>

                <div style="background-color: #f0f9ff;
                           border-left: 4px solid #3b82f6;
                           padding: 12px;
                           margin-bottom: 20px;
                           border-radius: 4px;">
                    <p style="margin: 0; font-size: 14px; color: #1e40af;">
                        <strong>Password Requirements:</strong>
                    </p>
                    <ul style="margin: 8px 0 0 20px; font-size: 14px; color: #1e40af;">
                        <li>At least 6 characters long</li>
                        <li>Use a combination of letters and numbers</li>
                        <li>Avoid using common words or patterns</li>
                    </ul>
                </div>

                <button type="submit">Reset Password</button>

                <p style="margin-top: 30px; text-align: center;">
                    Remember your password?
                    <a th:href="@{/login}"
                       style="color: #1dbf73;
                              text-decoration: none;
                              font-weight: 500;">
                        Back to Login
                    </a>
                </p>
            </form>
        </div>
    </main>

    <style>
        /* Additional hover effect for links */
        .form-container a:hover {
            text-decoration: underline !important;
        }
    </style>
</body>
</html>
